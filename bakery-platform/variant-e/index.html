<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakeriet på Hjørnet</title>
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/catalog.css">
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innholdet</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index.html" id="brand-name">Bakeriet på Hjørnet</a>
      <a class="cart-link" href="./cart.html" id="cart-link" aria-label="Handlekurv, tom">
        <span>Handlekurv</span>
        <span class="cart-badge" id="cart-badge" aria-hidden="true" hidden>0</span>
      </a>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1 id="hero-title">&nbsp;</h1>
      <p class="hero-desc muted" id="hero-desc"></p>
      <div class="hero-pickup card" id="hero-pickup" hidden></div>
    </div>
  </section>

  <nav class="cat-nav" id="cat-nav" aria-label="Kategorier" hidden>
    <div class="container">
      <div class="cat-nav-list" id="cat-nav-list"></div>
    </div>
  </nav>

  <main class="container" id="main">
    <div id="state" aria-live="polite"></div>
    <div id="catalog"></div>
  </main>

  <footer class="site-footer" id="site-footer" hidden>
    <div class="container footer-inner" id="footer-content"></div>
  </footer>

  <script type="module" src="./scripts/catalog.js"></script>
</body>
</html>
