<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakeri - bestill på nett</title>
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/catalog.css">
</head>
<body>
  <a class="skip-link" href="#innhold">Hopp til innholdet</a>

  <header class="site-header">
    <div class="container">
      <div class="header-bar card">
        <a class="brand" href="./index.html">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name" id="brand-name">Bakeriet</span>
        </a>
        <a class="btn btn-primary cart-link" href="./cart.html" id="cart-link">
          Handlekurv
          <span class="cart-badge" id="cart-badge" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="innhold" class="container">
    <section class="hero card" id="hero" hidden></section>
    <div id="status" aria-live="polite"></div>
    <nav class="category-nav" id="category-nav" aria-label="Kategorier" hidden></nav>
    <div id="catalog"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-card card" id="footer-card" hidden></div>
    </div>
  </footer>

  <script type="module" src="./scripts/catalog.js"></script>
</body>
</html>
