<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handlekurv | Bakeriet</title>
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/cart.css">
</head>
<body>
  <a class="skip-link" href="#innhold">Hopp til innholdet</a>

  <header class="site-header">
    <div class="container">
      <div class="header-bar card">
        <a class="brand" href="./index.html">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name" id="brand-name">Bakeriet</span>
        </a>
        <a class="btn btn-primary cart-link" href="./cart.html" id="cart-link" aria-current="page">
          Handlekurv
          <span class="cart-badge" id="cart-badge" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="innhold" class="container">
    <h1 class="page-title">Handlekurven din</h1>

    <div id="status" class="card status-card" aria-live="polite">Henter handlekurven...</div>

    <div class="cart-layout" id="cart-layout" hidden>
      <section class="cart-lines" id="cart-lines" aria-label="Varer i handlekurven"></section>

      <aside class="summary-col" aria-label="Oppsummering">
        <div class="card summary-card">
          <h2>Oppsummering</h2>
          <p class="summary-count muted" id="summary-count"></p>
          <div class="total-row">
            <span class="total-label">Totalt</span>
            <span class="price total-price" id="cart-total" aria-live="polite"></span>
          </div>
          <p class="vat-note muted">inkl. mva</p>
          <a class="btn btn-primary checkout-btn" href="./checkout.html">Til kassen</a>
          <a class="continue-link" href="./index.html">Fortsett å handle</a>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-card card" id="footer-card" hidden></div>
    </div>
  </footer>

  <script type="module" src="./scripts/cart.js"></script>
</body>
</html>
